*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
h1,h2,h3{margin:0 0 12px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--pri);color:#fff;font-weight:600}
button:hover{background:var(--pri-d)} button.sec{background:#efe6e7;color:var(--tx)} button.sec:hover{background:#e3d3d5}
button.danger{background:var(--err)} button.sm{padding:5px 10px;font-size:13px}
input,select,textarea{font:inherit;padding:8px 10px;border:1px solid #d8c6c9;border-radius:8px;width:100%;background:#fff}
label{display:block;font-weight:600;font-size:13px;margin:10px 0 4px;color:#4a3a3e}
.top{display:flex;align-items:center;gap:16px;background:var(--ink);color:#fff;border-bottom:3px solid var(--pri-l);padding:10px 20px;flex-wrap:wrap}
.top .brand{font-weight:700;font-size:18px}.top .sp{flex:1}
.top button{background:rgba(255,255,255,.15)} .top button.on{background:#fff;color:var(--pri-d)}
.nav{display:flex;gap:8px;flex-wrap:wrap}
.who{font-size:14px;opacity:.95}
main{max-width:1180px;margin:20px auto;padding:0 16px}
.card{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:800px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1;min-width:140px}.row>button{flex:0 0 auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--mute);letter-spacing:.03em}
.table-wrap{overflow-x:auto}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#f3e3e5;color:var(--pri-d);white-space:nowrap}
.badge.paid{background:#dcfce7;color:#166534}.badge.unpaid{background:#fef3c7;color:#92400e}.badge.late{background:#fecaca;color:#7f1d1d}.badge.done{background:#e7dfe0;color:#4a3a3e}
.muted{color:var(--mute)}.right{text-align:right}.mt{margin-top:14px}
.hint{background:#fff1f2;border-left:4px solid var(--pri-l);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14px}
.warnbox{background:#fffbeb;border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin:10px 0;font-size:14px}
.login{max-width:420px;margin:8vh auto}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:0}.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600}
.total{font-size:22px;color:var(--pri-d);font-weight:800}
.modal{position:fixed;inset:0;background:rgba(42,21,25,.6);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:30px 12px;z-index:50}
.modal[hidden]{display:none}.modal-box{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:22px;position:relative}
.close{position:absolute;right:12px;top:8px;background:none;color:var(--mute);font-size:26px;padding:2px 10px}.close:hover{background:none;color:var(--tx)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 14px}.steps span{font-size:12px;padding:4px 9px;border-radius:99px;background:#efe6e7;color:#6b5b5f}
.steps span.cur{background:var(--pri);color:#fff}.steps span.past{background:#fecdd3;color:var(--pri-d)}
.checks label{font-weight:400;display:flex;gap:8px;align-items:center;margin:6px 0}.checks input{width:auto}
.radios{display:flex;gap:18px;flex-wrap:wrap}.radios label{display:flex;gap:6px;align-items:center;font-weight:500;margin:6px 0}.radios input{width:auto}
.qr{display:flex;gap:14px;align-items:center;background:#fbf6f5;border:1px dashed #c9b3b7;border-radius:10px;padding:12px;margin:10px 0}
.qr svg{width:96px;height:96px;flex:none}
.hist{font-size:13px;margin:0;padding-left:18px}.hist li{margin:3px 0}
#toasts{position:fixed;right:16px;top:16px;z-index:99;display:flex;flex-direction:column;gap:8px;max-width:380px}
.toast{padding:12px 14px;border-radius:10px;color:#fff;box-shadow:0 4px 14px rgba(0,0,0,.2);font-weight:600}
.toast.ok{background:var(--ok)}.toast.err{background:var(--err)}.toast.info{background:var(--pri)}
#printArea{display:none}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{display:block;position:absolute;left:0;top:0;width:100%;padding:20px;color:#000;background:#fff}
 #printArea table td,#printArea table th{border-bottom:1px solid #999}}

.clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}.clock b{font-size:20px}.clock small{opacity:.8;font-size:12px}
.bell{position:relative;background:rgba(255,255,255,.15);border-radius:99px;padding:6px 10px}.bell b{position:absolute;top:-6px;right:-4px;background:var(--err);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px}.bell b:empty{display:none}
.alert{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 14px;border-radius:10px;margin-bottom:10px;border:1px solid;font-weight:600}
.alert.warn{background:#fef3c7;border-color:#f59e0b;color:#92400e}.alert.late{background:#fee2e2;border-color:#ef4444;color:#991b1b}.alert.info{background:#fff1f2;border-color:var(--rose);color:var(--pri-d)}
.alert .btns{display:flex;gap:6px;flex:none}

button.off,button:disabled{opacity:.4;cursor:not-allowed}button.off:hover{background:var(--pri)}button.sec.off:hover{background:#efe6e7}

textarea{font:inherit;padding:8px 10px;border:1px solid #d8c6c9;border-radius:8px;width:100%;resize:vertical}

.brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;display:block}
.bt{display:flex;flex-direction:column;line-height:1}.bt small{font-size:13px;color:#fff;font-weight:600;letter-spacing:.02em}.bt b{font-size:28px;color:var(--rose);font-weight:800;letter-spacing:.02em}
.login .logo{display:block;width:100%;max-width:340px;margin:0 auto 6px}
.inv-logo{display:block;width:240px;margin:0 0 10px}
::selection{background:#fecdd3}
@media print{body{background:#fff}}

function renderMain() {
  const m = $('#main'); if (!m) return;
  m.innerHTML = '<div id="alerts"></div><div id="view"></div>';
  renderAlerts(); renderView();
}
function renderView() {
  const el = $('#view'); if (!el) return;
  el.innerHTML = { orders: viewOrders, new: viewNew, pickup: viewPickup, services: viewServices, system: viewSystem }[S.view]();
}
// Thông báo thời gian thực, tính từ dữ liệu đơn hiện có
function alertList() {
  const a = [];
  for (const o of S.all) {
    if (isLate(o)) a.push({ k: 'late-' + o.id, cls: 'late', t: `Đơn ${o.id} (${o.customerName}) đã quá giờ trả dự kiến mà chưa xử lý xong. Hãy kiểm tra và hoàn tất.`, id: o.id });
    if (o.status === 'DA_XU_LY') a.push({ k: 'notify-' + o.id, cls: 'warn', t: `Đơn ${o.id} (${o.customerName}) đã xử lý xong, cần thông báo cho khách qua SĐT.`, id: o.id });
  }
  return a.filter((x) => !S.dismissed.has(x.k));
}
function renderAlerts() {
  const list = alertList(), el = $('#alerts'), bell = $('#bellN');
  if (bell) bell.textContent = list.length || '';
  if (!el) return;
  el.innerHTML = list.slice(0, 5).map((x) => `<div class="alert ${x.cls}"><span>${esc(x.t)}</span><span class="btns">${x.id ? `<button class="sm" data-act="open" data-id="${esc(x.id)}">Xử lý</button>` : ''}${x.go ? `<button class="sm" data-act="nav" data-v="${x.go}">Xem</button>` : ''}<button class="sm sec" data-act="dismiss" data-k="${esc(x.k)}">Đóng</button></span></div>`).join('')
    + (list.length > 5 ? `<div class="muted">… và ${list.length - 5} thông báo khác</div>` : '');
}
async function poll() {
  if (!S.user || document.hidden) return;
  try { await loadAll(); } catch (e) { return; }
  renderAlerts();
  const a = document.activeElement, typing = a && ['INPUT', 'SELECT', 'TEXTAREA'].includes(a.tagName) && $('#main') && $('#main').contains(a);
  if (!typing && S.view === 'orders') renderView();
}

// ---------- màn hình: danh sách đơn ----------
function viewOrders() {
  const opts = ['<option value="">Tất cả trạng thái</option>'].concat(S.statuses.map((s) => `<option value="${s.key}" ${S.filter.status === s.key ? 'selected' : ''}>${esc(s.label)}</option>`)).join('');
  const rows = S.orders.map((o) => `<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.customerName)}<br><span class="muted">${esc(o.phone)}</span></td><td>${esc(o.serviceName)}<br><span class="muted">${o.weightKg} kg</span></td>
    <td class="right">${money(o.total)}</td><td>${payBadge(o)}</td><td>${fmt(o.expectedReturnAt)}</td><td>${statusBadge(o)}</td><td><button class="sm" data-act="open" data-id="${esc(o.id)}">Mở</button></td></tr>`).join('');
  return `<div class="card"><h2>Danh sách đơn hàng</h2>${S.user.role === 'chucuahang' ? '<div class="hint">Chủ cửa hàng chỉ xem đơn; thao tác nhận/xử lý/trả đồ do Nhân viên thực hiện.</div>' : ''}
    <div class="row"><div><label>Lọc theo trạng thái</label><select id="fStatus">${opts}</select></div><div><label>Tìm theo tên khách</label><input id="fName" value="${esc(S.filter.name)}" placeholder="VD: Nguyễn Văn An"></div><div><label>Tìm theo SĐT</label><input id="fPhone" value="${esc(S.filter.phone)}" placeholder="VD: 0905123456"></div><button data-act="filter">Lọc</button></div></div>
    <div class="card table-wrap"><table><thead><tr><th>Mã</th><th>Khách</th><th>Dịch vụ</th><th class="right">Tổng tiền</th><th>Thanh toán</th><th>Trả dự kiến</th><th>Trạng thái</th><th></th></tr></thead>
    <tbody>${rows || '<tr><td colspan="8" class="muted">Chưa có đơn nào</td></tr>'}</tbody></table></div>`;
}

// ---------- form đơn dùng chung (tạo mới / sửa) ----------
function orderFields(p, o) {
  const kg = S.services.filter((s) => s.type === 'kg' && s.active), ex = S.services.filter((s) => s.type === 'extra' && s.active);
  const exp = o ? new Date(o.expectedReturnAt) : new Date(Date.now() + 24 * 3600 * 1000);
  return `<div class="grid2"><div><label>Loại dịch vụ</label><select id="${p}svc" data-total="${p}">${kg.map((s) => `<option value="${s.id}" ${o && o.serviceId === s.id ? 'selected' : ''}>${esc(s.name)} — ${money(s.price)}/kg</option>`).join('')}</select></div>
    <div><label>Số ký (kg)</label><input id="${p}kg" type="number" step="0.1" min="0.1" max="100" value="${o ? o.weightKg : ''}" data-total="${p}"></div></div>
    <label>Dịch vụ thêm (cộng thêm tiền)</label><div class="checks">${ex.map((s) => `<label><input type="checkbox" class="${p}ex" value="${s.id}" data-total="${p}" ${o && o.extras.some((e) => e.serviceId === s.id) ? 'checked' : ''}> ${esc(s.name)} (+${money(s.price)})</label>`).join('') || '<span class="muted">Chưa có dịch vụ thêm</span>'}</div>
    <label>Thời gian trả đồ dự kiến</label><input id="${p}exp" type="datetime-local" value="${toLocalInput(exp)}">
    <div class="hint">Tạm tính: <span class="total" id="${p}tot">—</span> <span class="muted">(tổng tiền chính thức do hệ thống tính khi lưu)</span></div>`;
}
function readFields(p) {
  const v = $('#' + p + 'exp').value;
  return { serviceId: $('#' + p + 'svc').value, weightKg: Number($('#' + p + 'kg').value), extraIds: [...document.querySelectorAll('.' + p + 'ex:checked')].map((x) => x.value), expectedReturnAt: v ? new Date(v).toISOString() : '' };
}
function updateTotal(p) {
  const el = $('#' + p + 'tot'); if (!el) return;
  const svc = S.services.find((s) => s.id === $('#' + p + 'svc').value), w = Number($('#' + p + 'kg').value);
  const extra = [...document.querySelectorAll('.' + p + 'ex:checked')].reduce((a, x) => a + (S.services.find((s) => s.id === x.value)?.price || 0), 0);
  el.textContent = svc && w > 0 ? money(Math.round(svc.price * w) + extra) : '—';
}

// ---------- màn hình: nhận đồ ----------
function viewNew() {
  const c = S.cust;
  let step1 = `<div class="row"><div><label>Số điện thoại khách</label><input id="nPhone" value="${esc(S.newPhone)}" ${c ? 'readonly' : ''} placeholder="VD: 0905123456"></div>
    ${c ? '<button class="sec" data-act="resetCust">Nhập lại</button>' : '<button data-act="checkCust">Kiểm tra khách hàng</button>'}</div>`;
  if (c && c.type === 'CU') step1 += `<div class="hint"><b>Khách cũ:</b> ${esc(c.name)} — dùng thông tin cũ.</div>`;
  if (c && c.type === 'MOI') step1 += `<div class="hint"><b>Khách mới</b> — nhập tên khách.</div><label>Tên khách</label><input id="nName" value="${esc(S.newName)}">`;
  return `<div class="card"><h2>Nhận đồ từ khách</h2><p class="muted">Kiểm tra khách hàng → chọn dịch vụ → nhập số ký → nhập thời gian trả dự kiến → hệ thống tính tổng tiền.</p>${step1}</div>
    ${c ? `<div class="card"><h3>Thông tin đơn giặt</h3>${orderFields('n_')}<div class="mt"><button data-act="createOrder">Tạo đơn & chuyển sang xác nhận với khách</button></div></div>` : ''}`;
}

// ---------- màn hình: trả đồ ----------
function viewPickup() {
  const r = S.pkResults;
  const rows = r ? r.map((o) => `<tr><td><b>${esc(o.id)}</b></td><td>${esc(o.customerName)}<br><span class="muted">${esc(o.phone)}</span></td><td>${esc(o.serviceName)} · ${o.weightKg} kg</td><td class="right">${money(o.total)}</td><td>${payBadge(o)}</td><td><button class="sm" data-act="open" data-id="${esc(o.id)}">Xử lý trả đồ</button></td></tr>`).join('') : '';
  return `<div class="card"><h2>Khách đến lấy đồ</h2><p class="muted">Chỉ cần nhập 1 trong 2: số điện thoại hoặc tên. Nếu trùng tên, hãy tìm bằng số điện thoại.</p>
    <div class="radios"><label><input type="radio" name="pkm" value="phone" ${S.pkMode === 'phone' ? 'checked' : ''}> Tìm bằng SĐT</label><label><input type="radio" name="pkm" value="name" ${S.pkMode === 'name' ? 'checked' : ''}> Tìm bằng tên</label></div>
    <div class="row"><div><input id="pkQ" placeholder="${S.pkMode === 'phone' ? 'Số điện thoại' : 'Tên khách'}"></div><button data-act="pkSearch">Tìm đơn</button></div></div>
    ${r ? `<div class="card table-wrap"><h3>Kết quả</h3><table><thead><tr><th>Mã</th><th>Khách</th><th>Dịch vụ</th><th class="right">Tổng</th><th>Thanh toán</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="6" class="muted">Không có đơn nào đang chờ khách lấy</td></tr>'}</tbody></table></div>` : ''}`;
}

// ---------- màn hình: dịch vụ (Chủ cửa hàng) ----------
function viewServices() {
  const rows = S.services.map((s) => `<tr><td>${esc(s.id)}</td><td><input id="sn_${s.id}" value="${esc(s.name)}"></td><td>${s.type === 'kg' ? 'Tính theo kg' : 'Dịch vụ thêm'}</td>
    <td><input id="sp_${s.id}" type="number" min="1" step="1000" value="${s.price}"></td><td><label class="checks"><input type="checkbox" id="sa_${s.id}" ${s.active ? 'checked' : ''}> Đang áp dụng</label></td><td><button class="sm" data-act="saveSvc" data-id="${s.id}">Lưu</button></td></tr>`).join('');
  return `<div class="card"><h2>Bảng giá dịch vụ</h2><div class="hint">Giá mới chỉ áp dụng cho đơn tạo sau đó; đơn đã tạo giữ giá cũ. Đơn giá: đồng/kg (dịch vụ thêm: đồng/đơn).</div>
    <div class="table-wrap"><table><thead><tr><th>Mã</th><th>Tên dịch vụ</th><th>Loại</th><th>Đơn giá (đ)</th><th>Áp dụng</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <div class="card"><h3>Thêm dịch vụ mới</h3><div class="row"><div><label>Tên dịch vụ</label><input id="nsName"></div><div><label>Đơn giá (đ)</label><input id="nsPrice" type="number" min="1" step="1000"></div>
    <div><label>Loại</label><select id="nsType"><option value="kg">Tính theo kg</option><option value="extra">Dịch vụ thêm (cộng tiền cố định)</option></select></div><button data-act="addSvc">Thêm</button></div></div>`;
}
function viewSystem() {
  return `<div class="card"><h2>Dữ liệu demo</h2><p>Dữ liệu được lưu vào file <code>data/db.json</code> nên không mất khi tắt server.</p>
    <div class="warnbox">Khởi tạo lại sẽ xóa toàn bộ đơn hàng, khách hàng và bảng giá hiện có, trả về dữ liệu mẫu ban đầu.</div><button class="danger" data-act="reset">Khởi tạo lại dữ liệu mẫu</button></div>`;
}

// ---------- chi tiết đơn (modal) ----------
async function showOrder(o) {
  S.openId = o.id;
  const idx = FLOW.findIndex(([k]) => k === o.status);
  const steps = FLOW.map(([k, l], i) => `<span class="${i < idx ? 'past' : i === idx ? 'cur' : ''}">${i + 1}. ${l}</span>`).join('');
  const hist = o.history.slice().reverse().map((h) => `<li>${fmt(h.at)} — ${esc(h.action)} <span class="muted">(${esc(h.by)})</span></li>`).join('');
  const ex = o.extras.map((e) => `<br><span class="muted">+ ${esc(e.name)}: ${money(e.amount)}</span>`).join('');
  const noti = o.notifications.map((n) => `${fmt(n.at)} (${n.channel === 'GOI' ? 'gọi điện' : 'nhắn tin'})`).join('; ') || '—';
  $('#modalBody').innerHTML = `<h2>Đơn ${esc(o.id)} ${statusBadge(o)}</h2><div class="steps">${steps}</div>
    <div class="grid2"><dl class="kv"><dt>Khách hàng</dt><dd>${esc(o.customerName)}</dd><dt>SĐT</dt><dd>${esc(o.phone)}</dd><dt>Dịch vụ</dt><dd>${esc(o.serviceName)} (${money(o.unitPrice)}/kg)</dd><dt>Số ký</dt><dd>${o.weightKg} kg${ex}</dd></dl>
    <dl class="kv"><dt>Tổng tiền</dt><dd class="total">${money(o.total)}</dd><dt>Thanh toán</dt><dd>${payBadge(o)} ${o.paymentMethod ? esc(PAY_LABEL[o.paymentMethod]) : ''}</dd><dt>Trả dự kiến</dt><dd>${fmt(o.expectedReturnAt)}</dd><dt>Đã thông báo</dt><dd>${noti}</dd></dl></div>
    <hr><div id="actions">${actionsHtml(o)}</div><h3 class="mt">Lịch sử xử lý</h3><ul class="hist">${hist}</ul>`;
  $('#modal').hidden = false; updateTotal('e_');
}
function payForm(prefix) {
  return `<label>Phương thức thanh toán</label><select id="${prefix}Method"><option value="TIEN_MAT">Tiền mặt</option><option value="QR">QR Code</option></select><div id="${prefix}Qr" hidden>${qrBox()}</div>`;
}
function actionsHtml(o) {
  if (S.user.role !== 'nhanvien') return '<div class="hint">Chỉ Nhân viên được thao tác trên đơn. Bạn đang ở chế độ xem.</div>';
  const id = esc(o.id);
  switch (o.status) {
    case 'CHO_XAC_NHAN':
      if (o.needsCorrection) return `<div class="warnbox"><b>Khách báo thông tin sai.</b> Sửa lại thông tin cho khách, sau đó xác nhận lại.</div>
        <div class="grid2"><div><label>Tên khách</label><input id="e_name" value="${esc(o.customerName)}"></div><div><label>Số điện thoại</label><input id="e_phone" value="${esc(o.phone)}"></div></div>${orderFields('e_', o)}
        <button data-act="saveEdit" data-id="${id}">Lưu thông tin đã sửa</button>`;
      return `<div class="hint"><b>Xác nhận lại thông tin với khách</b> (tên, SĐT, dịch vụ, số ký, thời gian trả, tổng tiền ở trên). Thông tin đã đúng chưa?</div>
        <button data-act="infoOk" data-id="${id}">✔ Thông tin đúng</button> <button class="sec" data-act="infoBad" data-id="${id}">✖ Thông tin sai</button>`;
    case 'CHO_CHON_THANH_TOAN':
      return `<h3>Chọn trạng thái thanh toán</h3><div class="radios"><label><input type="radio" name="pt" value="TRUOC" checked> Thanh toán trước (khách trả khi đưa đồ)</label><label><input type="radio" name="pt" value="SAU"> Thanh toán sau (trả khi nhận đồ)</label></div>
        <div id="ptBefore">${payForm('pt')}</div><div class="mt"><button data-act="pay" data-id="${id}">Xác nhận thanh toán</button></div>`;
    case 'CHO_TAO_DON': return `<button data-act="confirmCreate" data-id="${id}">Xác nhận tạo đơn</button>`;
    case 'DA_TAO_DON': return `<div class="hint">Đơn đã được tạo. Bắt đầu giặt & sấy.</div><button data-act="startProc" data-id="${id}">Bắt đầu xử lý (giặt & sấy)</button>`;
    case 'DANG_XU_LY':
      return `<div class="${isLate(o) ? 'warnbox' : 'hint'}">Chờ xử lý — thời gian trả dự kiến ${fmt(o.expectedReturnAt)} (${remaining(o.expectedReturnAt)}).</div><button data-act="finishProc" data-id="${id}">Gấp đồ vào bao & cập nhật Đã xử lý</button>`;
    case 'DA_XU_LY':
      return `<div class="hint">Nhân viên tự gọi hoặc nhắn tin cho khách trên điện thoại, sau đó ghi nhận tại đây.</div><div class="grid2"><div><label>Hình thức thông báo</label><select id="nfChannel"><option value="GOI">Gọi điện</option><option value="NHAN_TIN">Nhắn tin</option></select></div>
        <div><label>Ghi chú (không bắt buộc)</label><input id="nfNote" maxlength="200"></div></div><div class="mt"><button data-act="notify" data-id="${id}">Đã thông báo cho khách</button></div>`;
    case 'CHO_KHACH_LAY': {
      const paid = o.paymentStatus === 'DA_THANH_TOAN';
      const btn = (act, label, block, cls = '') => `<button class="${cls}${block ? ' off' : ''}" data-act="${act}" data-id="${id}" ${block ? `data-block="${esc(block)}" aria-disabled="true"` : ''}>${label}</button>`;
      const next = !o.invoicePrinted ? 'Bấm "In hóa đơn"' : !o.invoiceAttached ? 'Bấm "Gắn hóa đơn vào túi đồ"' : !paid ? 'Chọn phương thức và bấm "Thu tiền"' : 'Bấm "Giao đồ — khách đã lấy đồ"';
      let h = `<h3>Trả đồ cho khách</h3><div class="hint"><b>Bước tiếp theo:</b> ${next}. (Nút bị mờ là chưa đến bước đó.)</div>
        <p>${o.invoicePrinted ? '✔' : '1.'} ${btn('printInv', o.invoicePrinted ? 'In lại hóa đơn' : 'In hóa đơn', '', 'sm')}</p>
        <p>${o.invoiceAttached ? '✔' : '2.'} ${btn('attachInv', 'Gắn hóa đơn vào túi đồ', !o.invoicePrinted ? 'Hãy bấm "In hóa đơn" (bước 1) trước.' : o.invoiceAttached ? 'Đã gắn hóa đơn vào túi đồ rồi.' : '', 'sm')}</p>`;
      if (paid) h += `<div class="hint">Đơn đã thanh toán trước → đưa đồ cho khách.</div>`;
      else h += `<div class="warnbox"><b>Chưa thanh toán ${money(o.total)}</b> — thu tiền khách trước khi giao đồ.</div>${payForm('cl')}${btn('collect', 'Thu tiền & cập nhật Đã thanh toán', !o.invoiceAttached ? 'Hãy in và gắn hóa đơn vào túi đồ trước khi thu tiền.' : '')}`;
      const hb = !o.invoiceAttached ? 'Hãy in hóa đơn (bước 1) và gắn vào túi đồ (bước 2) trước.' : !paid ? 'Đơn chưa thanh toán: hãy thu tiền khách trước khi giao đồ.' : '';
      return h + `<p class="mt">${btn('handover', 'Giao đồ — khách đã lấy đồ', hb)}</p>`;
    }
    default: return '<div class="hint">Đơn đã hoàn thành.</div>';
  }
}

function closeModal() { $('#modal').hidden = true; S.openId = null; }

// ---------- hành động ----------
async function step(id, path, body, msg, method = 'POST') {
  const r = await doit(() => api(`/orders/${id}${path}`, method, body), msg);
  if (r) { await refresh().catch(() => {}); showOrder(r.order); }
  return r;
}
const ACT = {
  fill: (d) => { $('#lu').value = d.u; $('#lp').value = d.p; },
  async login() {
    const r = await doit(() => api('/auth/login', 'POST', { username: $('#lu').value.trim(), password: $('#lp').value }));
    if (!r) return;
    S.token = r.token; S.user = r.user; S.view = null; sessionStorage.setItem('t', r.token); sessionStorage.setItem('u', JSON.stringify(r.user));
    render(); toast('Xin chào ' + r.user.name, 'ok');
  },
  async logout() { await doit(() => api('/auth/logout', 'POST')); localLogout('Đã đăng xuất'); },
  nav(d) {
    if (!NAV[S.user.role].some(([k]) => k === d.v)) return toast('Bạn không đủ quyền truy cập chức năng này', 'err');
    S.view = d.v; render();
  },
  closeModal,
  dismiss(d) { S.dismissed.add(d.k); renderAlerts(); },
  async open(d) { const r = await doit(() => api('/orders/' + d.id)); if (r) showOrder(r.order); },
  async filter() { S.filter = { status: $('#fStatus').value, name: $('#fName').value.trim(), phone: $('#fPhone').value.trim() }; await refresh(); },
  async checkCust() {
    const phone = $('#nPhone').value.trim();
    const r = await doit(() => api('/customers/lookup?phone=' + encodeURIComponent(phone))); if (!r) return;
    S.newPhone = phone; S.cust = r.found ? { type: 'CU', name: r.customer.name } : { type: 'MOI' }; renderMain(); updateTotal('n_');
    toast(r.found ? 'Khách cũ: dùng thông tin cũ' : 'Khách mới: vui lòng nhập tên', 'info');
  },
  resetCust() { S.cust = null; S.newName = ''; renderMain(); },
  async createOrder() {
    const body = { customerType: S.cust.type, phone: S.newPhone, name: $('#nName') ? $('#nName').value : undefined, ...readFields('n_') };
    const r = await doit(() => api('/orders', 'POST', body), 'Đã tạo đơn. Hãy xác nhận lại thông tin với khách.'); if (!r) return;
    S.cust = null; S.newPhone = ''; S.newName = ''; await refresh(); showOrder(r.order);
  },
  infoOk: (d) => step(d.id, '/confirm-info', { correct: true }, 'Khách xác nhận thông tin đúng'),
  infoBad: (d) => step(d.id, '/confirm-info', { correct: false }, 'Đã ghi nhận thông tin sai, hãy sửa lại'),
  saveEdit: (d) => step(d.id, '', { name: $('#e_name').value, phone: $('#e_phone').value, ...readFields('e_') }, 'Đã sửa thông tin và tính lại tổng tiền', 'PUT'),
  pay(d) {
    const timing = document.querySelector('input[name=pt]:checked').value;
    return step(d.id, '/payment', { timing, method: timing === 'TRUOC' ? $('#ptMethod').value : undefined }, 'Đã cập nhật trạng thái thanh toán');
  },
  confirmCreate: (d) => step(d.id, '/confirm-create', undefined, 'Đã xác nhận tạo đơn'),
  startProc: (d) => step(d.id, '/start-processing', undefined, 'Đã chuyển sang Đang xử lý'),
  finishProc: (d) => step(d.id, '/finish-processing', undefined, 'Đã xử lý xong, đồ đã vào bao'),
  notify: (d) => step(d.id, '/notify', { channel: $('#nfChannel').value, note: $('#nfNote').value }, 'Đã ghi nhận thông báo cho khách'),
  async printInv(d) {
    const r = await step(d.id, '/invoice/print', undefined, 'Đã in hóa đơn');
    if (r) { $('#printArea').innerHTML = invoiceHtml(r.order); const im = $('#printArea img'); if (im && im.decode) await im.decode().catch(() => {}); setTimeout(() => { try { window.print(); } catch (e) { toast('Không mở được hộp thoại in, nhưng hóa đơn đã được ghi nhận. Bạn có thể bấm In lại.', 'info'); } }, 100); }
  },
  attachInv: (d) => step(d.id, '/invoice/attach', undefined, 'Đã gắn hóa đơn vào túi đồ'),
  collect: (d) => step(d.id, '/collect-payment', { method: $('#clMethod').value }, 'Đã thu tiền, cập nhật Đã thanh toán'),
  async handover(d) { const r = await step(d.id, '/handover', undefined, 'Đã giao đồ. Đơn hoàn thành!'); if (r) { S.pkResults = null; renderMain(); } },
  async pkSearch() {
    const q = $('#pkQ').value.trim(); const key = S.pkMode;
    try {
      const r = await api('/pickup/search?' + key + '=' + encodeURIComponent(q));
      S.pkResults = r.orders; renderMain();
    } catch (e) {
      if (e.message === '401') return;
      toast(e.message, 'err');
      if (e.code === 'MULTIPLE_MATCH') { S.pkMode = 'phone'; S.pkResults = null; renderMain(); $('#pkQ').focus(); } // trùng tên -> đổi sang tìm bằng SĐT
    }
  },
  async saveSvc(d) {
    const body = { name: $('#sn_' + d.id).value, price: Number($('#sp_' + d.id).value), active: $('#sa_' + d.id).checked };
    if (await doit(() => api('/services/' + d.id, 'PUT', body), 'Đã lưu dịch vụ ' + d.id)) await refresh();
  },
  async addSvc() {
    const body = { name: $('#nsName').value, price: Number($('#nsPrice').value), type: $('#nsType').value };
    if (await doit(() => api('/services', 'POST', body), 'Đã thêm dịch vụ')) await refresh();
  },
  async reset() {
    if (!confirm('Xóa toàn bộ dữ liệu hiện tại và khởi tạo lại dữ liệu mẫu?')) return;
    if (await doit(() => api('/admin/reset', 'POST'), 'Đã khởi tạo lại dữ liệu mẫu')) await refresh();
  },
};
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  if (b.classList.contains('off')) return toast(b.dataset.block || 'Chưa thực hiện được bước này', 'err'); // nút chưa đến bước: giải thích lý do
  const f = ACT[b.dataset.act]; if (f) Promise.resolve(f(b.dataset, b)).catch((x) => toast(x.message, 'err'));
});
document.addEventListener('input', (e) => {
  const ds = e.target.dataset || {};
  if (ds.total) updateTotal(ds.total);
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.total) updateTotal(t.dataset.total);
  if (t.name === 'pkm') { S.pkMode = t.value; S.pkResults = null; renderMain(); }
  if (t.name === 'pt') $('#ptBefore').hidden = t.value === 'SAU';
  if (t.id === 'ptMethod' || t.id === 'clMethod') $('#' + t.id.replace('Method', 'Qr')).hidden = t.value !== 'QR';
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'lp' || e.target.id === 'lu') ACT.login();
  if (e.target.id === 'pkQ') ACT.pkSearch();
  if (e.target.id === 'nPhone') ACT.checkCust();
  if (e.target.id === 'fName' || e.target.id === 'fPhone') ACT.filter();
});
setInterval(() => {
  const c = $('#clock'); if (!c) return; const d = new Date();
  c.innerHTML = `<b>${d.toLocaleTimeString('vi-VN')}</b><small>${d.toLocaleDateString('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit', year: 'numeric' })}</small>`;
}, 1000);
setInterval(poll, 5000);
window.addEventListener('storage', (e) => { if (e.key === 'laundry247_db_v1') poll(); });
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
render();

</script></body></html>
